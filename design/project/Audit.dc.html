<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Журнал аудиту</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&amp;family=Fira+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#F6F3ED}
a{color:#5B2C6F}a:hover{color:#4A2259}
.root{font-family:'Commissioner',system-ui,sans-serif;font-feature-settings:'tnum' 1;color:#1E1A16}
button,input{font-family:inherit}
.mono{font-family:'Fira Mono',ui-monospace,monospace}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;font-size:14px;font-weight:600;line-height:1;border:1px solid transparent;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn-secondary{background:#FFFFFF;color:#1E1A16;border-color:#CFC6B7}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #5B2C6F;outline-offset:2px}
.rail{flex:0 0 64px;background:#FBF9F5;border-right:1px solid #E3DCD0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0}
.rl{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:#4D463D}
.rl-on{background:#F2EAF4;color:#5B2C6F;box-shadow:inset 3px 0 0 #5B2C6F}
.top{min-height:56px;box-sizing:border-box;padding:8px 28px;background:#FFFFFF;border-bottom:1px solid #E3DCD0;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.chipf{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid #CFC6B7;background:#FFFFFF;font-size:13px;font-weight:500;color:#1E1A16;cursor:pointer;white-space:nowrap}
.chipf-on{border-color:#5B2C6F;background:#F2EAF4;color:#5B2C6F;font-weight:600}
.entry{display:grid;grid-template-columns:28px 120px 220px minmax(0,1fr) 160px;gap:14px;align-items:start;padding:14px 18px;border-bottom:1px solid #EFEAE1}
.exp{width:28px;height:28px;border:0;background:transparent;color:#4D463D;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.act{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:12px;font-weight:700;background:#EFEAE1;color:#4D463D}
.act-red{background:#FBE6E4;color:#A12A1F}
.act-blue{background:#E4ECF9;color:#1F4F99}
.diff{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;background:#FBF9F5}
.diff th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6E665A;padding:8px 10px;border-bottom:1px solid #E3DCD0}
.diff td{padding:8px 10px;border-bottom:1px solid #EFEAE1;vertical-align:top}
.was{color:#A12A1F;text-decoration:line-through;text-decoration-color:rgba(161,42,31,.5)}
.now{color:#1D6A3A;font-weight:600}
.av{width:28px;height:28px;background:#E8DDEB;color:#5B2C6F;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
</style>
</helmet>
<div class="root" style="min-height: 1050px; display: flex; background: #F6F3ED">
  <nav class="rail" aria-label="Розділи">
    <svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true" style="margin-bottom: 14px"><rect x="4" y="6" width="6" height="24" fill="#5B2C6F"></rect><rect x="12" y="9" width="6" height="21" fill="#8E5BA3"></rect><rect x="20" y="7" width="5" height="23" fill="#5B2C6F" transform="rotate(-12 22 30)"></rect><rect x="2" y="30" width="32" height="2.5" fill="#1E1A16"></rect></svg>
    <a class="rl" href="#" aria-label="Користувачі"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg></a>
    <a class="rl" href="#" aria-label="Ролі"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg></a>
    <a class="rl" href="#" aria-label="Локації"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></a>
    <a class="rl rl-on" href="#" aria-label="Журнал аудиту" aria-current="page"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg></a>
  </nav>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header class="top">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Журнал аудиту</h1>
      <span style="font-size: 14px; color: #4D463D">хто, що й коли змінив · записи не редагуються</span>
      <button class="btn btn-secondary" type="button" style="margin-left: auto"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Експорт CSV</button>
      <span style="width: 32px; height: 32px; background: #4D463D; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center" aria-label="Віктор Гнатюк, системний адміністратор">ВГ</span>
    </header>

    <main style="box-sizing: border-box; padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1376px; width: 100%">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <label style="width: 280px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid #CFC6B7; background: #FFFFFF; color: #6E665A"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="Об’єкт: номер, книга, логін" aria-label="Пошук об’єкта" style="flex: 1; min-width: 0; border: 0; outline: none; font-size: 13px; background: transparent"></label>
        <button class="chipf" type="button">Тип об’єкта: усі<svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="chipf chipf-on" type="button">Дія: зміна, скасування, блокування<svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="chipf" type="button">Користувач: усі<svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="chipf" type="button"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Сьогодні, 15.11.2026</button>
        <span style="margin-left: auto; font-size: 13px; color: #4D463D">142 записи</span>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E3DCD0">
        <div class="entry" style="padding-top: 10px; padding-bottom: 10px; background: #EFEAE1; font-size: 12px; font-weight: 600; color: #4D463D"><span></span><span>Час</span><span>Хто</span><span>Дія та об’єкт</span><span>Де</span></div>
        <sc-for list="{{ entries }}" as="e" hint-placeholder-count="6">
          <div class="entry">
            <button class="exp" type="button" aria-expanded="{{ e.open }}" aria-label="Показати зміни"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="transform: {{ e.rot }}"><path d="M9 6l6 6-6 6"></path></svg></button>
            <span style="font-size: 14px; padding-top: 4px">{{ e.when }}</span>
            <span style="display: flex; gap: 10px; align-items: center"><span class="av" aria-hidden="true">{{ e.ini }}</span><span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 14px; font-weight: 600">{{ e.who }}</span><span style="font-size: 12px; color: #4D463D">{{ e.role }}</span></span></span>
            <div style="min-width: 0">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 2px"><span class="act {{ e.actCls }}">{{ e.action }}</span><a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none">{{ e.subject }}</a></div>
              <sc-if value="{{ e.open }}" hint-placeholder-val="{{ false }}">
                <table class="diff">
                  <thead><tr><th style="width: 30%">Поле</th><th>Було</th><th>Стало</th></tr></thead>
                  <tbody>
                    <sc-for list="{{ e.changes }}" as="c" hint-placeholder-count="2">
                      <tr><td style="color: #4D463D">{{ c.f }}</td><td class="was">{{ c.a }}</td><td class="now">{{ c.b }}</td></tr>
                    </sc-for>
                  </tbody>
                </table>
              </sc-if>
              <sc-if value="{{ e.closed }}" hint-placeholder-val="{{ true }}">
                <div style="font-size: 13px; color: #4D463D; margin-top: 6px">{{ e.summary }}</div>
              </sc-if>
            </div>
            <span style="font-size: 13px; color: #4D463D; padding-top: 4px">{{ e.where }}</span>
          </div>
        </sc-for>
        <div style="display: flex; justify-content: space-between; padding: 10px 18px; font-size: 13px; color: #4D463D"><span>1–6 з 142</span><a href="#" style="font-weight: 600">Показати ще 50</a></div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    const e = (when, who, role, ini, action, actCls, subject, where, changes, open) => ({
      when, who, role, ini, action, actCls, subject, where, open: !!open, closed: !open,
      rot: open ? 'rotate(90deg)' : 'none',
      changes: changes.map(([f, a, b]) => ({ f, a, b })),
      summary: changes.map(([f, a, b]) => f + ': ' + a + ' → ' + b).join(' · ')
    });
    return {
      entries: [
        e('14:20', 'Марина Левченко', 'Комерційний менеджер', 'МЛ', 'Зміна ціни', 'act-blue', 'Книга «Амадока»', 'Офіс', [['Роздрібна ціна', '650,00 ₴', '720,00 ₴'], ['Діє з', '—', '16.11.2026, 00:00'], ['Причина', '—', 'Зміна ціни постачальника']], true),
        e('14:12', 'Андрій Коваль', 'Комірник', 'АК', 'Зміна статусу', 'act-blue', 'Переміщення ПМ-2026-01482', 'Магазин на Хрещатику', [['Статус', 'В дорозі', 'Отримано з розбіжністю'], ['Прийнято, од.', '0', '128 з 132']], true),
        e('12:03', 'Віктор Гнатюк', 'Системний адміністратор', 'ВГ', 'Зміна ролей', '', 'Користувач t.shevchuk (Тарас Шевчук)', 'Офіс', [['Ролі', 'Касир', 'Касир, Комірник']]),
        e('10:47', 'Оксана Мельник', 'Адміністратор магазину', 'ОМ', 'Скасування', 'act-red', 'Онлайн-замовлення ОН-2026-10431', 'Магазин на Хрещатику', [['Статус', 'Підтверджене', 'Скасоване'], ['Причина', '—', 'Клієнт відмовився']]),
        e('09:58', 'Віктор Гнатюк', 'Системний адміністратор', 'ВГ', 'Розблокування', '', 'Користувач o.bondarenko', 'Офіс', [['Стан', 'Заблокований', 'Активний']]),
        e('09:12', 'Система', 'Автоматично', 'С', 'Блокування', 'act-red', 'Користувач o.bondarenko', 'Магазин на Подолі', [['Стан', 'Активний', 'Заблокований'], ['Причина', '—', '5 невдалих спроб входу']])
      ]
    };
  }
}
</script>
</body>
</html>
