<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Полиця — пошук «Жадан»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&amp;family=EB+Garamond:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F3ED}
a{color:#5B2C6F}a:hover{color:#4A2259}
.root{font-family:'Commissioner',system-ui,sans-serif;font-feature-settings:'tnum' 1;color:#1E1A16}
button,input{font-family:inherit}
.disp{font-family:'EB Garamond',Georgia,serif}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #5B2C6F;outline-offset:2px}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3DCD0}
.hin{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.hl{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#1E1A16;text-decoration:none}
.cov{aspect-ratio:2/3;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:#F6F3ED}
.c1{background:#3D2A4A}.c2{background:#2F4A3E}.c3{background:#7A3B2E}.c4{background:#2E3F5C}.c5{background:#8A6A35}.c6{background:#4D463D}.c7{background:#5B2C6F}.c8{background:#1E1A16}
.cb{width:18px;height:18px;box-sizing:border-box;border:1.5px solid #8C8478;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF}
.cb-on{background:#5B2C6F;border-color:#5B2C6F}
.opt{display:flex;align-items:center;gap:10px;font-size:14px;min-height:30px}
.fh{font-size:13px;font-weight:700;margin:0 0 8px}
.add{height:40px;border:1px solid #5B2C6F;background:#FFFFFF;color:#5B2C6F;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.add:hover{background:#5B2C6F;color:#FFFFFF}
.av-ok{color:#1D6A3A}.av-mid{color:#855100}
.dot{width:8px;height:8px;display:inline-block}
</style>
</helmet>
<div class="root" style="min-height: 1300px; background: #F6F3ED; display: flex; flex-direction: column">
  <header class="hdr">
    <div class="hin">
      <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1E1A16"><svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true"><rect x="4" y="6" width="6" height="24" fill="#5B2C6F"></rect><rect x="12" y="9" width="6" height="21" fill="#8E5BA3"></rect><rect x="20" y="7" width="5" height="23" fill="#5B2C6F" transform="rotate(-12 22 30)"></rect><rect x="2" y="30" width="32" height="2.5" fill="#1E1A16"></rect></svg><span class="disp" style="font-size: 28px; font-weight: 600">Полиця</span></a>
      <label style="flex: 1 1 360px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 2px solid #1E1A16; background: #FFFFFF"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg><input type="search" value="Жадан" aria-label="Пошук книг" style="flex: 1; min-width: 0; border: 0; outline: none; font-size: 16px; background: transparent"></label>
      <a class="hl" href="#"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: #5B2C6F"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Мій магазин: <strong>Хрещатик</strong></a>
      <a class="hl" href="#">Відстежити замовлення</a>
      <a class="hl" href="#" aria-label="Кошик, 3 книжки" style="position: relative"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 13H6.2L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; background: #5B2C6F; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">3</span></a>
    </div>
  </header>

  <main style="max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 28px 24px 48px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #4D463D">Результати пошуку</span><h1 class="disp" style="margin: 0; font-size: 38px; font-weight: 600">«Жадан» — 14 книжок</h1></div>
      <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px">Сортувати<select style="height: 40px; border: 1px solid #CFC6B7; background: #FFFFFF; padding: 0 10px; font-size: 14px"><option>Спершу популярні</option></select></label>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <aside aria-label="Фільтри" style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 24px">
        <div style="background: #F2EAF4; padding: 14px; display: flex; flex-direction: column; gap: 6px">
          <label class="opt" style="font-weight: 700"><span class="cb cb-on"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.5"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Є в моєму магазині</label>
          <span style="font-size: 13px; color: #4D463D; padding-left: 28px">Хрещатик · забрати сьогодні. <a href="#">Змінити магазин</a></span>
        </div>
        <div><p class="fh">Категорія</p>
          <label class="opt"><span class="cb cb-on"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.5"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Сучасна проза <span style="color: #6E665A">9</span></label>
          <label class="opt"><span class="cb"></span>Поезія <span style="color: #6E665A">4</span></label>
          <label class="opt"><span class="cb"></span>Есеїстика <span style="color: #6E665A">1</span></label>
        </div>
        <div><p class="fh">Ціна, ₴</p>
          <div style="display: flex; gap: 8px; align-items: center"><input type="text" value="200" aria-label="Ціна від" style="width: 80px; height: 38px; border: 1px solid #CFC6B7; padding: 0 10px; font-size: 14px; box-sizing: border-box"><span>—</span><input type="text" value="400" aria-label="Ціна до" style="width: 80px; height: 38px; border: 1px solid #CFC6B7; padding: 0 10px; font-size: 14px; box-sizing: border-box"></div>
        </div>
        <div><p class="fh">Видавництво</p>
          <label class="opt"><span class="cb"></span>Meridian Czernowitz</label>
          <label class="opt"><span class="cb"></span>Фоліо</label>
        </div>
        <button type="button" style="align-self: flex-start; border: 0; background: transparent; color: #5B2C6F; font-size: 14px; font-weight: 600; padding: 0; cursor: pointer">Скинути фільтри</button>
      </aside>

      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px 20px">
          <sc-for list="{{ books }}" as="b" hint-placeholder-count="8">
            <article style="display: flex; flex-direction: column; gap: 10px">
              <a href="#" class="cov {{ b.c }}" style="text-decoration: none"><span class="disp" style="font-size: 26px; font-weight: 600; line-height: 1.05">{{ b.t }}</span><span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase">Сергій Жадан</span></a>
              <div style="display: flex; flex-direction: column; gap: 2px"><a href="#" style="font-size: 16px; font-weight: 600; color: #1E1A16; text-decoration: none">{{ b.t }}</a><span style="font-size: 13px; color: #4D463D">{{ b.y }}</span></div>
              <div style="display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 18px">{{ b.p }}</strong><span class="{{ b.avCls }}" style="font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><span class="dot" style="background: currentColor"></span>{{ b.av }}</span></div>
              <button class="add" type="button">У кошик</button>
            </article>
          </sc-for>
        </div>
        <nav aria-label="Сторінки" style="display: flex; justify-content: center; gap: 6px"><button type="button" style="width: 40px; height: 40px; border: 1px solid #1E1A16; background: #FFFFFF; font-weight: 700" aria-current="page">1</button><button type="button" style="width: 40px; height: 40px; border: 1px solid #CFC6B7; background: #FFFFFF">2</button></nav>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const b = (t, y, p, c, av, mid) => ({ t, y, p, c, av, avCls: mid ? 'av-mid' : 'av-ok' });
    return {
      books: [
        b('Інтернат', 'Роман · 2017', '346,50 ₴', 'c1', 'Сьогодні'),
        b('Ворошиловград', 'Роман · 2010', '360,00 ₴', 'c2', 'Сьогодні'),
        b('Месопотамія', 'Роман у новелах · 2014', '340,00 ₴', 'c3', 'Сьогодні'),
        b('Депеш Мод', 'Роман · 2004', '320,00 ₴', 'c4', 'Сьогодні'),
        b('Біг Мак', 'Оповідання · 2003', '290,00 ₴', 'c5', 'Завтра', true),
        b('Тамплієри', 'Поезія · 2016', '300,00 ₴', 'c6', 'Сьогодні'),
        b('Список кораблів', 'Поезія · 2020', '280,00 ₴', 'c7', 'Сьогодні'),
        b('Антена', 'Поезія · 2018', '310,00 ₴', 'c8', 'Завтра', true)
      ]
    };
  }
}
</script>
</body>
</html>
