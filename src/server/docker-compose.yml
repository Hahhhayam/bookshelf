services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - bookstore-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cache:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      ConnectionStrings__Bookstore: Server=db;Database=Bookstore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: cache:6379
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

  web:
    build:
      context: ../client
      args:
        VITE_SHOP_CUSTOMER_ID: ${VITE_SHOP_CUSTOMER_ID:-}
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  bookstore-data:
